<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Options Alpha Agent — decision record</title>
<style>
  :root{
    --bg:#fbfbfa; --panel:#fff; --ink:#1a1a18; --muted:#6b6b66; --line:#e6e4df;
    --accent:#2f6f4f; --warn:#9a5b00; --bad:#a33a2a; --chip:#f1efea;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141412; --panel:#1c1c1a; --ink:#eceae4; --muted:#9a978f;
           --line:#2e2d2a; --accent:#7bbd95; --warn:#d79a4a; --bad:#e0806f;
           --chip:#262523; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1040px;margin:0 auto;padding:28px 20px 80px}
  h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
  h2{font-size:16px;margin:34px 0 10px;letter-spacing:-.01em}
  .sub{color:var(--muted);margin:0 0 20px}
  .banner{background:var(--warn);color:#fff;padding:10px 14px;border-radius:8px;
          font-weight:600;margin-bottom:20px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;
         padding:16px 18px;margin-bottom:14px}
  .row{display:flex;flex-wrap:wrap;gap:10px}
  .stat{flex:1 1 150px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:12px 14px}
  .stat b{display:block;font-size:22px;font-weight:650;letter-spacing:-.02em}
  .stat span{color:var(--muted);font-size:12.5px}
  .chip{display:inline-block;background:var(--chip);border-radius:999px;
        padding:2px 9px;font-size:12px;color:var(--muted);margin-right:6px}
  .funnel div.step{display:flex;align-items:baseline;gap:12px;padding:7px 0;
        border-bottom:1px dashed var(--line)}
  .funnel div.step:last-child{border-bottom:0}
  .funnel .n{font-variant-numeric:tabular-nums;font-weight:650;min-width:56px;
        text-align:right;font-size:18px}
  .funnel .track{flex:0 0 34%;max-width:34%}
  .funnel .bar{height:9px;border-radius:5px;background:var(--accent);opacity:.85;
        min-width:2px}
  .funnel .lbl{flex:1;min-width:0}
  .funnel .note{color:var(--muted);font-size:12.5px;display:block}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;
     padding:6px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;
     background:var(--panel)}
  td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  td.t{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted)}
  td.px{text-align:right;font-variant-numeric:tabular-nums}
  .scroll{max-height:460px;overflow:auto;border:1px solid var(--line);
          border-radius:10px;background:var(--panel)}
  .overflow{overflow-x:auto}
  .a{font-weight:600;white-space:nowrap}
  .a-entered,.a-exit_target{color:var(--accent)}
  .a-refused,.a-declined,.a-exit_stop{color:var(--bad)}
  .a-shrunk,.a-missed,.a-error,.a-entry_failed{color:var(--warn)}
  .a-no_signal,.a-holding,.a-skipped_no_bar,.a-cooldown{color:var(--muted)}
  button{font:inherit;background:var(--chip);color:var(--ink);border:1px solid var(--line);
         border-radius:999px;padding:4px 11px;cursor:pointer;margin:0 6px 6px 0}
  button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:transparent}
  footer{color:var(--muted);font-size:12.5px;margin-top:40px;border-top:1px solid var(--line);
         padding-top:14px}
  code{background:var(--chip);padding:1px 5px;border-radius:4px;font-size:12.5px}
</style>
</head>
<body>
<div class="wrap" id="app">loading…</div>

<script src="data.js"></script>
<script>
const D = window.DASHBOARD || {sessions: []};
const app = document.getElementById("app");
const esc = s => String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const money = n => n == null ? "—" : (n < 0 ? "−$" : "$") + Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2});

function render(){
  if(!D.sessions.length){
    app.innerHTML = "<h1>Options Alpha Agent</h1><p class='sub'>No sessions recorded yet. The page fills itself in from the journal the agent writes as it trades.</p>";
    return;
  }
  const s = D.sessions[D.sessions.length - 1];
  const top = s.funnel[0].n || 1;
  let h = "";

  if(D.is_example){
    h += "<div class='banner'>Example data — invented so the page could be built before the agent traded. Nothing here happened.</div>";
  }

  h += "<h1>Options Alpha Agent</h1>";
  h += "<p class='sub'>What the agent looked at, what it decided, and why — every minute of the session, including the minutes it did nothing.</p>";

  h += "<div class='panel'>" +
    "<span class='chip'>session " + esc(s.session) + "</span>" +
    "<span class='chip'>account " + esc(s.account || "—") + "</span>" +
    "<span class='chip'>" + esc(s.feed || "—") + " feed</span>" +
    (s.dry_run ? "<span class='chip'>dry run — no orders sent</span>" : "<span class='chip'>live paper trading</span>") +
    (s.limits.max_premium_per_trade ? "<span class='chip'>max $" + s.limits.max_premium_per_trade + " per trade</span>" : "") +
    (s.limits.flat_by ? "<span class='chip'>flat by " + esc(s.limits.flat_by) + " New York</span>" : "") +
    "</div>";

  const traded = s.funnel[4].n;
  h += "<div class='row'>" +
    stat(money(s.pnl), "profit or loss this session") +
    stat(traded, traded === 1 ? "contract bought" : "contracts bought") +
    stat(s.funnel[0].n, "minutes observed") +
    stat(s.funnel[0].n - traded, "minutes it chose not to trade") +
    "</div>";

  h += "<h2>From looking to trading</h2>";
  h += "<div class='panel funnel'>";
  s.funnel.forEach(f => {
    const pct = Math.max(0.4, 100 * f.n / top);
    h += "<div class='step'><span class='n'>" + f.n + "</span>" +
         "<span class='lbl'><b>" + esc(f.label) + "</b>" +
         "<span class='note'>" + esc(f.note) + "</span></span>" +
         "<span class='track'><span class='bar' style='display:block;width:" +
         pct.toFixed(1) + "%'></span></span></div>";
  });
  h += "</div>";
  h += "<p class='sub'>Each step is a rule narrowing the previous one. The drop between any two lines is countable, and every row behind it says which rule did it and what it read.</p>";

  if(s.refusal_reasons.length){
    h += "<h2>Why it said no</h2><div class='panel'><div class='overflow'><table><thead><tr><th style='width:70px'>Times</th><th>Reason</th></tr></thead><tbody>";
    s.refusal_reasons.forEach(r => {
      h += "<tr><td class='px'>" + r.n + "</td><td>" + esc(r.reason) + "</td></tr>";
    });
    h += "</tbody></table></div></div>";
  }

  if(Object.keys(s.exits).length){
    h += "<h2>How positions ended</h2><div class='panel'>";
    const names = {exit_target:"hit the profit target", exit_stop:"hit the stop loss",
                   exit_time:"held long enough and timed out",
                   exit_flat_by:"closed at the end-of-day cutoff"};
    Object.keys(s.exits).forEach(k => {
      h += "<span class='chip'>" + s.exits[k] + " × " + esc(names[k] || k) + "</span>";
    });
    h += "</div>";
  }

  h += "<h2>Every decision</h2>";
  h += "<div id='filters'></div><div class='scroll'><table><thead><tr>" +
       "<th style='width:70px'>Time</th><th style='width:76px'>Price</th>" +
       "<th style='width:110px'>Decision</th><th>Why</th></tr></thead>" +
       "<tbody id='feed'></tbody></table></div>";

  if(s.orders.length){
    h += "<h2>Orders sent to the broker</h2><div class='panel overflow'><table><thead><tr>" +
         "<th>Kind</th><th>Contract</th><th>Qty</th><th>Limit</th><th>Result</th></tr></thead><tbody>";
    s.orders.forEach(o => {
      const q = o.request || {}, r = o.response || {};
      h += "<tr><td>" + esc(o.kind) + "</td><td><code>" + esc(q.symbol) + "</code></td>" +
           "<td class='px'>" + esc(q.qty) + "</td><td class='px'>" + esc(q.limit_price || "market") + "</td>" +
           "<td>" + esc(o.error || r.status || "—") + "</td></tr>";
    });
    h += "</tbody></table></div>";
  }

  h += "<footer>Built from the agent's own append-only journal by " +
       "<code>scripts/build_dashboard.py</code>. Every number on this page is " +
       "recomputable from the JSONL files in the repository — if the page and the " +
       "record disagree, the record is right.</footer>";

  app.innerHTML = h;
  wireFeed(s);
}

function stat(v, label){
  return "<div class='stat'><b>" + esc(v) + "</b><span>" + esc(label) + "</span></div>";
}

function wireFeed(s){
  const kinds = [...new Set(s.decisions.map(d => d.action))];
  const quiet = new Set(["no_signal","holding","skipped_no_bar","cooldown"]);
  let active = new Set(kinds.filter(k => !quiet.has(k)));
  if(!active.size) active = new Set(kinds);

  const bar = document.getElementById("filters");
  bar.innerHTML = kinds.map(k =>
    "<button data-k='" + k + "' aria-pressed='" + active.has(k) + "'>" + esc(k) +
    " (" + s.decisions.filter(d => d.action === k).length + ")</button>").join("") +
    "<button data-k='__all'>show everything</button>";

  const draw = () => {
    const rows = s.decisions.filter(d => active.has(d.action)).slice(0, 1200);
    document.getElementById("feed").innerHTML = rows.map(d =>
      "<tr><td class='t'>" + esc((d.bar_t_et || "").slice(11,16)) + "</td>" +
      "<td class='px'>" + (d.close ? d.close.toFixed(2) : "—") + "</td>" +
      "<td class='a a-" + esc(d.action) + "'>" + esc(d.action) + "</td>" +
      "<td>" + esc(d.reason) + "</td></tr>").join("") ||
      "<tr><td colspan='4' style='color:var(--muted)'>Nothing selected.</td></tr>";
  };

  bar.addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b) return;
    if(b.dataset.k === "__all"){ active = new Set(kinds); }
    else if(active.has(b.dataset.k)) active.delete(b.dataset.k);
    else active.add(b.dataset.k);
    [...bar.querySelectorAll("button[data-k]")].forEach(x => {
      if(x.dataset.k !== "__all") x.setAttribute("aria-pressed", active.has(x.dataset.k));
    });
    draw();
  });
  draw();
}

render();
</script>
</body>
</html>
