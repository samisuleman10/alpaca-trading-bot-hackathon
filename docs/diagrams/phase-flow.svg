<svg xmlns="http://www.w3.org/2000/svg" width="680" height="700" viewBox="0 0 680 700" role="img">
<title>Build phase flow for the Alpaca hackathon</title>
<desc>Eight phases in sequence: design, implementation plan, backtest, a decision gate on whether the edge survives costs, then building the trader and risk layer, the dashboard and ask box, deploying to trade live, and finally submitting.</desc>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
<path d="M 0 0 L 8 4 L 0 8 z" fill="#888780"/>
</marker>
<style>
.t { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; }
.s { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; }
</style>
</defs>
<rect x="0" y="0" width="680" height="700" fill="#FFFFFF"/>

<rect x="190" y="20" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="t" x="340" y="39" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Design</text>
<text class="s" x="340" y="58" text-anchor="middle" dominant-baseline="central" fill="#534AB7">this document, sections 1 to 7</text>
<line x1="340" y1="80" x2="340" y2="100" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="106" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="t" x="340" y="125" text-anchor="middle" dominant-baseline="central" fill="#444441">Implementation plan</text>
<text class="s" x="340" y="144" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">what to build, in what order</text>
<line x1="340" y1="166" x2="340" y2="186" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="192" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="t" x="340" y="211" text-anchor="middle" dominant-baseline="central" fill="#444441">Backtest the strategy</text>
<text class="s" x="340" y="230" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">one symbol, one year of data</text>
<line x1="340" y1="252" x2="340" y2="272" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="278" width="300" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="t" x="340" y="297" text-anchor="middle" dominant-baseline="central" fill="#633806">Decision gate</text>
<text class="s" x="340" y="316" text-anchor="middle" dominant-baseline="central" fill="#854F0B">does the edge survive costs</text>
<line x1="340" y1="338" x2="340" y2="358" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="364" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="t" x="340" y="383" text-anchor="middle" dominant-baseline="central" fill="#444441">Trader and risk layer</text>
<text class="s" x="340" y="402" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">runs locally, paper account</text>
<line x1="340" y1="424" x2="340" y2="444" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="450" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="t" x="340" y="469" text-anchor="middle" dominant-baseline="central" fill="#444441">Dashboard and ask box</text>
<text class="s" x="340" y="488" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">runs locally first</text>
<line x1="340" y1="510" x2="340" y2="530" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="536" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="t" x="340" y="555" text-anchor="middle" dominant-baseline="central" fill="#444441">Deploy and trade live</text>
<text class="s" x="340" y="574" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">four counted sessions before the deadline</text>
<line x1="340" y1="596" x2="340" y2="616" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="622" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="t" x="340" y="641" text-anchor="middle" dominant-baseline="central" fill="#444441">Submit</text>
<text class="s" x="340" y="660" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">repo, video, slides, cover image</text>
</svg>
