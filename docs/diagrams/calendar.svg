<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" role="img">
<title>The build calendar</title>
<desc>Eight days from Friday 28 August to Friday 4 September. The market is closed at the weekend. Building runs the whole way; live trading runs Monday as a dry run and Tuesday to Friday for real, giving four counted sessions.</desc>
<defs>
<style>
.d { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; }
.s { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 400; }
.b { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; }
.lbl { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; }
</style>
</defs>
<rect x="0" y="0" width="680" height="280" fill="#FFFFFF"/>

<text class="d" x="69"  y="26" text-anchor="middle" fill="#444441">Fri 28</text>
<text class="d" x="150" y="26" text-anchor="middle" fill="#B0AEA6">Sat 29</text>
<text class="d" x="231" y="26" text-anchor="middle" fill="#B0AEA6">Sun 30</text>
<text class="d" x="312" y="26" text-anchor="middle" fill="#444441">Mon 31</text>
<text class="d" x="393" y="26" text-anchor="middle" fill="#444441">Tue 1</text>
<text class="d" x="474" y="26" text-anchor="middle" fill="#444441">Wed 2</text>
<text class="d" x="555" y="26" text-anchor="middle" fill="#444441">Thu 3</text>
<text class="d" x="636" y="26" text-anchor="middle" fill="#444441">Fri 4</text>

<rect x="30"  y="36" width="78" height="18" rx="4" fill="#F1EFE8"/>
<rect x="111" y="36" width="78" height="18" rx="4" fill="#FFFFFF" stroke="#E2E0D8" stroke-width="1"/>
<rect x="192" y="36" width="78" height="18" rx="4" fill="#FFFFFF" stroke="#E2E0D8" stroke-width="1"/>
<rect x="273" y="36" width="78" height="18" rx="4" fill="#F1EFE8"/>
<rect x="354" y="36" width="78" height="18" rx="4" fill="#F1EFE8"/>
<rect x="435" y="36" width="78" height="18" rx="4" fill="#F1EFE8"/>
<rect x="516" y="36" width="78" height="18" rx="4" fill="#F1EFE8"/>
<rect x="597" y="36" width="78" height="18" rx="4" fill="#F1EFE8"/>
<text class="s" x="150" y="46" text-anchor="middle" dominant-baseline="central" fill="#B0AEA6">closed</text>
<text class="s" x="231" y="46" text-anchor="middle" dominant-baseline="central" fill="#B0AEA6">closed</text>

<text class="lbl" x="30" y="76" fill="#888780">BUILD</text>

<rect x="30"  y="84" width="78"  height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="b" x="69" y="99"  text-anchor="middle" dominant-baseline="central" fill="#3C3489">Design</text>
<text class="s" x="69" y="114" text-anchor="middle" dominant-baseline="central" fill="#534AB7">and plan</text>

<rect x="111" y="84" width="159" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="b" x="190" y="99"  text-anchor="middle" dominant-baseline="central" fill="#3C3489">Strategy, backtest</text>
<text class="s" x="190" y="114" text-anchor="middle" dominant-baseline="central" fill="#534AB7">the decision gate lands here</text>

<rect x="273" y="84" width="78"  height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="b" x="312" y="99"  text-anchor="middle" dominant-baseline="central" fill="#3C3489">Trader</text>
<text class="s" x="312" y="114" text-anchor="middle" dominant-baseline="central" fill="#534AB7">host, database</text>

<rect x="354" y="84" width="159" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="b" x="433" y="99"  text-anchor="middle" dominant-baseline="central" fill="#3C3489">Dashboard and ask box</text>
<text class="s" x="433" y="114" text-anchor="middle" dominant-baseline="central" fill="#534AB7">does not wait on the backtest</text>

<rect x="516" y="84" width="159" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="b" x="595" y="99"  text-anchor="middle" dominant-baseline="central" fill="#444441">Video, slides, write-up</text>
<text class="s" x="595" y="114" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">while it trades unattended</text>

<text class="lbl" x="30" y="156" fill="#888780">LIVE</text>

<rect x="273" y="164" width="78" height="44" rx="8" fill="#FBF7ED" stroke="#C9A227" stroke-width="1"/>
<text class="b" x="312" y="179" text-anchor="middle" dominant-baseline="central" fill="#7A6A45">Dry run</text>
<text class="s" x="312" y="194" text-anchor="middle" dominant-baseline="central" fill="#7A6A45">no orders</text>

<rect x="354" y="164" width="321" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="b" x="514" y="179" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Trading for real — four counted sessions</text>
<text class="s" x="514" y="194" text-anchor="middle" dominant-baseline="central" fill="#534AB7">the only profit and loss the judges will ever see</text>

<rect x="597" y="220" width="78" height="24" rx="6" fill="#3C3489"/>
<text class="s" x="636" y="233" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF">SUBMIT</text>

<text class="s" x="30" y="233" dominant-baseline="central" fill="#7A6A45">Today, before anything else: the brand-new paper account, funded at $100,000. Nothing counts until it exists.</text>
</svg>
