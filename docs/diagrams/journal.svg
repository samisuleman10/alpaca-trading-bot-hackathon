<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" role="img">
<title>The decision journal</title>
<desc>The live trader writes three tables in Supabase: decisions, orders and sessions. The dashboard only reads them. The backtest driver writes files instead, using the same columns, and never touches the journal.</desc>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
<path d="M 0 0 L 8 4 L 0 8 z" fill="#888780"/>
</marker>
<marker id="arrowdim" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
<path d="M 0 0 L 8 4 L 0 8 z" fill="#B0AEA6"/>
</marker>
<style>
.t { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; }
.s { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; }
.lbl { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; }
</style>
</defs>
<rect x="0" y="0" width="680" height="350" fill="#FFFFFF"/>

<rect x="238" y="26" width="196" height="216" rx="10" fill="#FAFAF7" stroke="#B0AEA6" stroke-width="0.5"/>
<text class="lbl" x="336" y="46" text-anchor="middle" fill="#888780">SUPABASE</text>

<rect x="254" y="60" width="164" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="t" x="336" y="76" text-anchor="middle" dominant-baseline="central" fill="#3C3489">decisions</text>
<text class="s" x="336" y="94" text-anchor="middle" dominant-baseline="central" fill="#534AB7">every minute, append only</text>

<rect x="254" y="120" width="164" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="t" x="336" y="136" text-anchor="middle" dominant-baseline="central" fill="#444441">orders</text>
<text class="s" x="336" y="154" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">status mirrors the broker</text>

<rect x="254" y="180" width="164" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="t" x="336" y="196" text-anchor="middle" dominant-baseline="central" fill="#444441">sessions</text>
<text class="s" x="336" y="214" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">one row a day</text>

<rect x="30" y="106" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="t" x="110" y="125" text-anchor="middle" dominant-baseline="central" fill="#444441">Live trader</text>
<text class="s" x="110" y="144" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">writes only</text>

<line x1="190" y1="134" x2="230" y2="134" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="482" y="106" width="168" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="t" x="566" y="125" text-anchor="middle" dominant-baseline="central" fill="#444441">Dashboard + ask box</text>
<text class="s" x="566" y="144" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">reads only</text>

<line x1="442" y1="134" x2="474" y2="134" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="30" y="272" width="160" height="52" rx="8" fill="#FFFFFF" stroke="#B0AEA6" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="t" x="110" y="290" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Backtest driver</text>
<text class="s" x="110" y="308" text-anchor="middle" dominant-baseline="central" fill="#888780">the rehearsal</text>

<line x1="190" y1="298" x2="230" y2="298" stroke="#B0AEA6" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowdim)"/>

<rect x="238" y="272" width="196" height="52" rx="8" fill="#FFFFFF" stroke="#B0AEA6" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="t" x="336" y="290" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Files on disk</text>
<text class="s" x="336" y="308" text-anchor="middle" dominant-baseline="central" fill="#888780">same columns, ~98,000 rows</text>

<text class="s" x="450" y="298" dominant-baseline="central" fill="#888780">never touches the journal</text>
</svg>
