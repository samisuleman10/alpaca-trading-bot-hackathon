<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" role="img">
<title>Signal on the stock, expressed in options</title>
<desc>Stock bars feed the decide function, which returns a directional view. The view plus the option chain feed the express function, which either returns an intent naming one contract or declines because the spread is too wide.</desc>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
<path d="M 0 0 L 8 4 L 0 8 z" fill="#888780"/>
</marker>
<marker id="arrowdim" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
<path d="M 0 0 L 8 4 L 0 8 z" fill="#B0AEA6"/>
</marker>
<style>
.t { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; }
.s { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; }
.lbl { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; }
</style>
</defs>
<rect x="0" y="0" width="680" height="320" fill="#FFFFFF"/>

<text class="lbl" x="40" y="24" fill="#888780">STAGE 1 &#8212; WHICH WAY</text>

<rect x="40" y="40" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="t" x="125" y="59" text-anchor="middle" dominant-baseline="central" fill="#444441">SPY 1-minute bars</text>
<text class="s" x="125" y="78" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">the shares, not options</text>

<line x1="210" y1="68" x2="242" y2="68" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="250" y="40" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="t" x="315" y="59" text-anchor="middle" dominant-baseline="central" fill="#3C3489">decide</text>
<text class="s" x="315" y="78" text-anchor="middle" dominant-baseline="central" fill="#534AB7">the trading rules</text>

<line x1="380" y1="68" x2="452" y2="68" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="460" y="40" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="t" x="560" y="59" text-anchor="middle" dominant-baseline="central" fill="#444441">View: up, down, nothing</text>
<text class="s" x="560" y="78" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">plus the numbers behind it</text>

<polyline points="560,96 560,128 315,128 315,152" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<text class="lbl" x="40" y="144" fill="#888780">STAGE 2 &#8212; WHICH CONTRACT</text>

<rect x="40" y="160" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="t" x="125" y="179" text-anchor="middle" dominant-baseline="central" fill="#444441">Option chain</text>
<text class="s" x="125" y="198" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">strikes, expiries, spreads</text>

<line x1="210" y1="188" x2="242" y2="188" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="250" y="160" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="t" x="315" y="179" text-anchor="middle" dominant-baseline="central" fill="#3C3489">express</text>
<text class="s" x="315" y="198" text-anchor="middle" dominant-baseline="central" fill="#534AB7">picks the contract</text>

<line x1="380" y1="188" x2="452" y2="188" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="460" y="160" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="t" x="560" y="179" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Intent: one contract</text>
<text class="s" x="560" y="198" text-anchor="middle" dominant-baseline="central" fill="#534AB7">named, sized, with exits</text>

<line x1="315" y1="216" x2="315" y2="248" stroke="#B0AEA6" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowdim)"/>

<rect x="190" y="256" width="250" height="44" rx="8" fill="#FBF7ED" stroke="#B0AEA6" stroke-width="0.5"/>
<text class="s" x="315" y="272" text-anchor="middle" dominant-baseline="central" fill="#7A6A45">or decline: nothing worth buying</text>
<text class="s" x="315" y="288" text-anchor="middle" dominant-baseline="central" fill="#7A6A45">spread too wide to pay for</text>
</svg>
