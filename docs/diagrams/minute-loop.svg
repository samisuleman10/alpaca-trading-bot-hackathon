<svg xmlns="http://www.w3.org/2000/svg" width="680" height="472" viewBox="0 0 680 472" role="img">
<title>One minute in the life of the live trader</title>
<desc>A bar closes. If a position is open, the exits are checked first - the stop and target written on the shares, and the flat-by time - and if one fires the contract is sold and the minute ends there. Only when flat does the strategy get consulted: decide forms a view, express names a contract, the risk gate may shrink or refuse it, an order goes to Alpaca under an identifier that cannot fire twice, and a journal row is written. On restart the trader asks the broker what it holds rather than trusting its own memory, and an independent job flattens everything after the close whether or not the trader is alive.</desc>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
<path d="M 0 0 L 8 4 L 0 8 z" fill="#888780"/>
</marker>
<marker id="arrowdim" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
<path d="M 0 0 L 8 4 L 0 8 z" fill="#B0AEA6"/>
</marker>
<style>
.t { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; }
.s { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; }
.lbl { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; }
</style>
</defs>
<rect x="0" y="0" width="680" height="472" fill="#FFFFFF"/>

<text class="lbl" x="40" y="30" fill="#888780">EVERY MINUTE, WHILE THE MARKET IS OPEN</text>

<rect x="40" y="46" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="t" x="125" y="65" text-anchor="middle" dominant-baseline="central" fill="#444441">A bar closes</text>
<text class="s" x="125" y="84" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">fetch it, or skip the minute</text>

<line x1="210" y1="74" x2="247" y2="74" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="255" y="46" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="t" x="340" y="65" text-anchor="middle" dominant-baseline="central" fill="#444441">Holding anything?</text>
<text class="s" x="340" y="84" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">ask the broker, not ourselves</text>

<line x1="425" y1="74" x2="462" y2="74" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="lbl" x="443" y="62" text-anchor="middle" fill="#888780">YES</text>

<rect x="470" y="46" width="170" height="56" rx="8" fill="#FBF7ED" stroke="#C9A227" stroke-width="1"/>
<text class="t" x="555" y="65" text-anchor="middle" dominant-baseline="central" fill="#7A6A45">Check the exits</text>
<text class="s" x="555" y="84" text-anchor="middle" dominant-baseline="central" fill="#7A6A45">stop, target, or 15:45</text>

<line x1="555" y1="102" x2="555" y2="126" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="470" y="134" width="170" height="56" rx="8" fill="#FBF7ED" stroke="#C9A227" stroke-width="1"/>
<text class="t" x="555" y="153" text-anchor="middle" dominant-baseline="central" fill="#7A6A45">Sell, and stop here</text>
<text class="s" x="555" y="172" text-anchor="middle" dominant-baseline="central" fill="#7A6A45">no new entry this minute</text>

<line x1="340" y1="102" x2="340" y2="126" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="lbl" x="356" y="118" fill="#888780">NO</text>

<rect x="255" y="134" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="t" x="340" y="153" text-anchor="middle" dominant-baseline="central" fill="#3C3489">decide</text>
<text class="s" x="340" y="172" text-anchor="middle" dominant-baseline="central" fill="#534AB7">which way, if any</text>

<polyline points="340,190 340,208 125,208 125,226" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="234" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="t" x="125" y="253" text-anchor="middle" dominant-baseline="central" fill="#3C3489">express</text>
<text class="s" x="125" y="272" text-anchor="middle" dominant-baseline="central" fill="#534AB7">which contract</text>

<line x1="210" y1="262" x2="247" y2="262" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="255" y="234" width="170" height="56" rx="8" fill="#FBF7ED" stroke="#C9A227" stroke-width="1"/>
<text class="t" x="340" y="253" text-anchor="middle" dominant-baseline="central" fill="#7A6A45">Risk gate</text>
<text class="s" x="340" y="272" text-anchor="middle" dominant-baseline="central" fill="#7A6A45">only says no, or smaller</text>

<line x1="425" y1="262" x2="462" y2="262" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="470" y="234" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="t" x="555" y="253" text-anchor="middle" dominant-baseline="central" fill="#444441">Order to Alpaca</text>
<text class="s" x="555" y="272" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">an ID that cannot fire twice</text>

<polyline points="555,290 555,308 340,308 340,326" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="255" y="334" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="t" x="340" y="353" text-anchor="middle" dominant-baseline="central" fill="#444441">Journal row</text>
<text class="s" x="340" y="372" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">what, and why, and when</text>

<rect x="40" y="406" width="290" height="50" rx="8" fill="#FFFFFF" stroke="#B0AEA6" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="s" x="185" y="422" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">On every start, and after every crash:</text>
<text class="s" x="185" y="440" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">the broker is the only source of truth.</text>

<rect x="350" y="406" width="290" height="50" rx="8" fill="#FFFFFF" stroke="#B0AEA6" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="s" x="495" y="422" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">15:50, on a different machine: close</text>
<text class="s" x="495" y="440" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">everything, alive or dead. No opinions.</text>
</svg>
