<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" viewBox="0 0 680 260" role="img">
<title>The strategy function contract</title>
<desc>Three inputs feed one decide function: price history readable only up to the current bar, the open position as read-only state, and the parameters. It returns either an intent or nothing at all.</desc>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
<path d="M 0 0 L 8 4 L 0 8 z" fill="#888780"/>
</marker>
<style>
.t { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; }
.s { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; }
</style>
</defs>
<rect x="0" y="0" width="680" height="260" fill="#FFFFFF"/>

<rect x="40" y="30" width="190" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="t" x="135" y="49" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Price history</text>
<text class="s" x="135" y="68" text-anchor="middle" dominant-baseline="central" fill="#534AB7">readable only up to now</text>

<rect x="40" y="106" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="t" x="135" y="125" text-anchor="middle" dominant-baseline="central" fill="#444441">Open position</text>
<text class="s" x="135" y="144" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">read only</text>

<rect x="40" y="182" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="t" x="135" y="201" text-anchor="middle" dominant-baseline="central" fill="#444441">Parameters</text>
<text class="s" x="135" y="220" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">thresholds and sizes</text>

<line x1="230" y1="58" x2="267" y2="118" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="230" y1="134" x2="267" y2="134" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="230" y1="210" x2="267" y2="150" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="275" y="94" width="150" height="80" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="t" x="350" y="124" text-anchor="middle" dominant-baseline="central" fill="#3C3489">decide</text>
<text class="s" x="350" y="144" text-anchor="middle" dominant-baseline="central" fill="#534AB7">the trading rules</text>

<line x1="429" y1="134" x2="457" y2="134" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="465" y="106" width="175" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="t" x="552" y="125" text-anchor="middle" dominant-baseline="central" fill="#444441">Intent</text>
<text class="s" x="552" y="144" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">or nothing at all</text>
</svg>
